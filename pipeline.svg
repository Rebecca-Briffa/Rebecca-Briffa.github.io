<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" role="img" aria-labelledby="pipeTitle">
  <title id="pipeTitle">From theory to observations, with computation in between</title>
  <rect x="8" y="28" width="180" height="88" rx="10" fill="#1b2a4a"/>
  <text x="98" y="70" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="18">Theory</text>
  <text x="98" y="92" text-anchor="middle" fill="#c9d4ee" font-family="Segoe UI, sans-serif" font-size="12">gravity, dark energy</text>
  <path d="M198 72 L248 72" stroke="#8b5e3c" stroke-width="3" fill="none"/>
  <polygon points="248,66 262,72 248,78" fill="#8b5e3c"/>
  <rect x="270" y="18" width="220" height="108" rx="10" fill="#49bf9d"/>
  <text x="380" y="62" text-anchor="middle" fill="#14352c" font-family="Georgia, serif" font-size="18">Computation</text>
  <text x="380" y="84" text-anchor="middle" fill="#1d4a3e" font-family="Segoe UI, sans-serif" font-size="12">CLASS, MCMC, genetic algorithms</text>
  <path d="M498 72 L548 72" stroke="#8b5e3c" stroke-width="3" fill="none"/>
  <polygon points="548,66 562,72 548,78" fill="#8b5e3c"/>
  <rect x="570" y="28" width="180" height="88" rx="10" fill="#1b2a4a"/>
  <text x="660" y="70" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="18">Observations</text>
  <text x="660" y="92" text-anchor="middle" fill="#c9d4ee" font-family="Segoe UI, sans-serif" font-size="12">CMB, SNe, BAO, RSD</text>
</svg>
